# moonflux CI — the gate suite runs on every push; the full E2E suite
# runs on demand. Gates assert structure, never wall-clock numbers
# (README decision 41), so a green run means the invariants held.
#
# The fast job skips the E2E legs (build matrix, both test suites, the
# generators' freshness) and runs on Linux. The full job runs every
# E2E gate — those scripts carry macOS idioms (BSD stat, lsof) and
# expect OpenSSL for the TLS legs, so it pins to a macOS runner and is
# triggered manually (workflow_dispatch) rather than on every push:
# the full suite takes ~25 minutes locally and would dominate wall
# time. Run it before merging anything that touches the data path.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    # gates.sh fast = fmt check + generator freshness + interface
    # freshness + the four-backend build matrix + both test suites +
    # the operator build. No E2E.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show toolchain
        run: |
          moon version --all
          python3 --version
      - name: Gates (fast)
        run: bash scripts/gates.sh fast

  full:
    # everything, including the E2E gates (real processes, fault
    # injection, independent Python peers). macOS because the gate
    # scripts use BSD userland. Manual trigger.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show toolchain
        run: |
          moon version --all
          python3 --version
          openssl version || true
      - name: Gates (full)
        run: bash scripts/gates.sh
