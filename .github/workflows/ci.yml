# moonflux CI — the gate suite runs on every push; the full E2E suite
# runs on demand. Gates assert structure, never wall-clock numbers
# (README decision 41), so a green run means the invariants held.
#
# The fast job skips the E2E legs and runs on Linux; the full job runs
# every E2E gate and pins to macOS because those scripts carry BSD
# idioms (BSD stat, lsof). Full is triggered manually: it takes ~25
# minutes locally and would dominate wall time if it ran on every push.
#
# Both jobs provision the wasmtime C API at the version the dev loop
# uses (48.0.2). That pin is not cosmetic — the shim mirrors wasmtime's
# struct layouts, and decision 14/T15 is the record of what an undersized
# mirror costs. The library installs under /usr/local because
# adapters/wasmtime-native/moon.pkg names that prefix in stub-cc-flags
# next to Homebrew's, so one source tree builds on both hosts; the
# runtime path is then handed over explicitly via MOONFLUX_WASMTIME_LIB
# rather than relying on the platform default baked into the shim.
#
# Known drift (open item, not a silent one): the MoonBit toolchain is
# installed as `latest`. The installer cannot pin — the CDN answers 403
# for versioned binary URLs (re-checked 2026-10-13 for two versions) —
# and the drift is real: between the 2026-10-11 green run and the
# 2026-10-13 one, `latest` started normalising C FFI boundaries to
# Int32, which failed `moon fmt --check` on 95 files. The dev loop is
# now on the same generation (moon 0.1.20261012) and the migration is
# in-tree (README decision 80), so the divergence is closed by moving
# the dev loop forward rather than by pinning. Pin it here as soon as a
# version string the CDN accepts is confirmed from a green run.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Concurrency is per JOB, not per run. A workflow-level group
# (ci-${{ github.ref }}) meant any push cancelled an in-flight manual
# `full` — which is exactly what happened the first time full was
# triggered by hand: a docs commit forty seconds later killed it. The
# fast job still wants cancellation (superseded pushes are worthless),
# while full is a deliberate 25-minute act that should not be collateral
# damage of someone typing `git push`.

jobs:
  fast:
    # gates.sh fast = fmt check + generator freshness + interface
    # freshness + the four-backend build matrix + both test suites +
    # the operator build. No E2E.
    concurrency:
      group: ci-fast-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOONFLUX_WASMTIME_LIB: /usr/local/lib/libwasmtime.so
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Cache the MoonBit registry index
        uses: actions/cache@v4
        with:
          path: ~/.moon/registry
          key: moon-registry-${{ runner.os }}
      - name: Fetch the MoonBit registry index
        # The single dependency's sources (dimon-83/mbel@0.3.3) are
        # vendored under .mooncakes/ and tracked in git, but moon still
        # resolves through the registry index, which a fresh runner does
        # not have: the first run failed all ten legs with "module was
        # not found in the registry", and --frozen does not help (tested
        # on a cloned tree with an empty index). This is the very step
        # moon's own hint names.
        run: moon update
      - name: Runner prerequisites
        # crosscheck-operators.sh waits for the served port with lsof.
        run: command -v lsof >/dev/null || sudo apt-get install -y lsof
      - name: Install wasmtime 48.0.2 C API
        run: |
          W=wasmtime-v48.0.2-x86_64-linux-c-api
          curl -sSfL -o wasmtime.tar.xz \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v48.0.2/$W.tar.xz"
          tar -xJf wasmtime.tar.xz
          sudo mkdir -p /usr/local/include /usr/local/lib
          sudo cp -R "$W/include/." /usr/local/include/
          sudo cp -R "$W/lib/." /usr/local/lib/
          sudo ldconfig
          # fail here, with a legible message, rather than three steps
          # later inside a gate that only says "libwasmtime not loaded"
          test -f /usr/local/include/wasmtime.h
          test -f "$MOONFLUX_WASMTIME_LIB"
      - name: Show toolchain
        run: |
          moon version --all
          python3 --version
      - name: Gates (fast)
        run: bash scripts/gates.sh fast

  # The container path. It runs on ubuntu-latest because that runner HAS a
  # docker daemon; this development machine does not (only the client), which is
  # exactly why the container half is proven here and not locally. The gate
  # builds the image from a clean checkout — the Dockerfile installs the
  # toolchain and builds the platform itself, so this job also proves that the
  # image needs nothing from the host but the source.
  docker:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show the engine
        run: |
          docker version
          docker compose version
      # Both heavy container runs are WATCHED (scripts/run-watched.sh): a long
      # run's resource numbers have to be written down while it runs, because a
      # run that takes its own caller down cannot be diagnosed afterwards from
      # its output. The numbers are reported, never gated (decision 41's rule),
      # and the samples are kept as an artifact so the evidence survives the job.
      - name: Docker gate (build, smoke, one catalog case), watched
        env:
          MOONFLUX_REQUIRE_DOCKER: "1"
          MOONFLUX_DOCKER_TAG: moonflux:ci
        run: bash scripts/run-watched.sh /tmp/rw-p42.log bash scripts/e2e-p42-docker.sh
      - name: Docker cluster gate (sc + spu x2 + runner), watched
        env:
          MOONFLUX_REQUIRE_DOCKER: "1"
          MOONFLUX_DOCKER_TAG: moonflux:ci
        run: bash scripts/run-watched.sh /tmp/rw-p49.log bash scripts/e2e-p49-docker-cluster.sh
      - name: Keep the resource samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-watch
          path: /tmp/rw-*.log
          if-no-files-found: ignore
          retention-days: 7

  full-linux:
    # the full suite on Linux (P34, item ② of the user's list). The macOS
    # full job proved the gates; "proven on macOS" is not the same claim as
    # "proven where the durability semantics come from" — fsync means
    # something different on each platform, and the storage gate now asserts
    # the platform's own primitive. Manual trigger, like `full`: the suite
    # takes tens of minutes and every push already runs `fast`.
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: ci-full-linux-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MOONFLUX_WASMTIME_LIB: /usr/local/lib/libwasmtime.so
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Cache the MoonBit registry index
        uses: actions/cache@v4
        with:
          path: ~/.moon/registry
          key: moon-registry-${{ runner.os }}
      - name: Fetch the MoonBit registry index
        run: moon update
      - name: Install wasmtime 48.0.2 C API
        run: |
          W=wasmtime-v48.0.2-x86_64-linux-c-api
          curl -sSfL -o wasmtime.tar.xz \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v48.0.2/$W.tar.xz"
          tar -xJf wasmtime.tar.xz
          sudo mkdir -p /usr/local/include /usr/local/lib
          sudo cp -R "$W/include/." /usr/local/include/
          sudo cp -R "$W/lib/." /usr/local/lib/
          sudo ldconfig
          test -f /usr/local/include/wasmtime.h
          test -f "$MOONFLUX_WASMTIME_LIB"
      - name: Runner prerequisites
        run: |
          # the E2E gates use lsof (kill by port) and python3 (independent
          # peers); openssl is present on the image but the security gates
          # need the CLI, so fail early with a legible message
          python3 --version
          if ! command -v lsof >/dev/null; then
            sudo apt-get update && sudo apt-get install -y lsof
          fi
          openssl version
      - name: Show toolchain
        run: |
          moon version --all
          python3 --version
          openssl version || true
          uname -a
      - name: Gates (full, Linux)
        run: bash scripts/gates.sh
      # The per-step logs ARE the evidence when a job dies: `step()` sends each
      # gate's output to its own file, so the console carries only PASS/FAIL and a
      # job killed from outside takes every explanation with it (decision 129 —
      # that is exactly what happened to p48 three times). Keep them, always.
      - name: Keep the per-step gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates-steps-linux
          path: /tmp/moonflux-gates.*/*.log
          if-no-files-found: ignore
          retention-days: 7


  full:
    # everything, including the E2E gates (real processes, fault
    # injection, independent Python peers). macOS because the gate
    # scripts use BSD userland. Manual trigger.
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: ci-full-macos-${{ github.ref }}
      cancel-in-progress: false
    runs-on: macos-14
    timeout-minutes: 90
    env:
      MOONFLUX_WASMTIME_LIB: /usr/local/lib/libwasmtime.dylib
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Cache the MoonBit registry index
        uses: actions/cache@v4
        with:
          path: ~/.moon/registry
          key: moon-registry-${{ runner.os }}
      - name: Fetch the MoonBit registry index
        run: moon update
      - name: Install wasmtime 48.0.2 C API
        run: |
          W=wasmtime-v48.0.2-aarch64-macos-c-api   # macos-14 runners are arm64
          curl -sSfL -o wasmtime.tar.xz \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v48.0.2/$W.tar.xz"
          tar -xJf wasmtime.tar.xz
          sudo mkdir -p /usr/local/include /usr/local/lib
          sudo cp -R "$W/include/." /usr/local/include/
          sudo cp -R "$W/lib/." /usr/local/lib/
          test -f /usr/local/include/wasmtime.h
          test -f "$MOONFLUX_WASMTIME_LIB"
      - name: Show toolchain
        run: |
          moon version --all
          python3 --version
          openssl version || true
      - name: Gates (full)
        run: bash scripts/gates.sh
      # The per-step logs ARE the evidence when a job dies: `step()` sends each
      # gate's output to its own file, so the console carries only PASS/FAIL and a
      # job killed from outside takes every explanation with it (decision 129 —
      # that is exactly what happened to p48 three times). Keep them, always.
      - name: Keep the per-step gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates-steps-macos
          path: /tmp/moonflux-gates.*/*.log
          if-no-files-found: ignore
          retention-days: 7

